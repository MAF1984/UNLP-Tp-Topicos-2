sonar.organization=maf1984
sonar.projectKey=MAF1984_UNLP-Tp-Topicos-2

# Directorios donde SonarCloud debe buscar el código fuente
sonar.sources=backend,frontend

# Archivos y carpetas que debe ignorar en el análisis
sonar.exclusions=**/__pycache__/**, **/*.pyc, **/.pytest_cache/**, backend/test_*.py

# Ruta del reporte de pytest que se genera en el pipeline
sonar.python.coverage.reportPaths=coverage.xml