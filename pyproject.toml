[project]
name = "ticketera-virtual"
version = "0.1.0"
description = "Plataforma de Ticketera Virtual - Trabajo Final Tópicos de Ingeniería de Software II"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src/backend/gateway"]
testpaths = ["src/backend/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
